<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#d32f2f">
  <title>GoldenHour</title>
  <!-- All paths are relative ("./") because GitHub Pages serves the app from a sub-folder. -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Yellow DEMO MODE banner: filled in by js/app.js on every screen change (PRD F2). -->
  <div id="demo-banner" class="demo-banner" role="status"></div>

  <!-- Every screen (S1–S18) is drawn inside this element by the router in js/app.js. -->
  <main id="app" class="app"></main>

  <!-- Shown only when a new service worker is waiting (PRD F1 "Update available"). -->
  <button id="update-bar" class="update-bar" type="button" hidden></button>

  <script type="module" src="js/app.js"></script>
</body>
</html>
