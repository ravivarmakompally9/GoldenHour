<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GoldenHour dev — Arm test harness</title>
  <style>
    /* Developer page: plain and readable, not the app's design. */
    body { font: 18px/1.4 system-ui, sans-serif; margin: 0; padding: 12px; background: #fff; color: #111; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    .note { background: #ffe14d; padding: 8px 10px; border-radius: 10px; font-weight: 700; font-size: 16px; }
    button, select { font: inherit; font-weight: 700; min-height: 56px; padding: 8px 14px; border-radius: 12px; border: 2px solid #111; background: #fff; width: 100%; margin-top: 8px; }
    button.primary { background: #111; color: #fff; }
    button.danger { background: #d32f2f; color: #fff; border-color: #9a1c1c; }
    button:disabled { opacity: .4; }
    #arm { font-size: 30px; font-weight: 800; margin-top: 12px; }
    #instruction { font-size: 24px; font-weight: 600; min-height: 3em; }
    #count { font-size: 44px; font-weight: 800; }
    #graph { height: 220px; margin: 8px 0; border: 1px solid #999; border-radius: 10px; }
    pre { font-size: 14px; background: #f4f4f4; padding: 10px; border-radius: 10px; overflow-x: auto; white-space: pre-wrap; }
    .row { display: flex; gap: 12px; font-size: 16px; color: #333; flex-wrap: wrap; }
    #verdict { font-size: 28px; font-weight: 800; padding: 10px; border-radius: 12px; }
    .NORMAL { background: #e2f5e4; color: #1b6e22; } .ABNORMAL, .NOT_COMPLETED { background: #fde8e6; color: #9a1c1c; } .NOT_TESTED { background: #fff3cd; color: #000; }
  </style>
</head>
<body>
  <h1>Arm test harness (F9)</h1>
  <p class="note">Developer test page — not the app. Runs src/lib/tests/arm.js alone with REAL sensors. No alerts, no calls.</p>

  <label>Mode
    <select id="mode"><option value="calibration">calibration</option><option value="emergency">emergency</option><option value="baseline">baseline</option></select>
  </label>
  <button id="start" class="primary">Start arm test</button>

  <div id="arm"></div>
  <div id="instruction"></div>
  <div id="count"></div>
  <div class="row"><span id="ready"></span><span id="live"></span><span id="rate"></span></div>
  <button id="placed" disabled>Phone is on the palm — start</button>
  <div id="graph"></div>
  <button id="cannot" class="danger" disabled>They cannot do this test</button>
  <button id="abort" disabled>Abort</button>

  <div id="verdict"></div>
  <pre id="result"></pre>
  <pre id="thresholds"></pre>

  <script type="module" src="./arm-harness.js"></script>
</body>
</html>
